<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Once Upon a Hatch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Nunito:wght@600;700;800&family=Pixelify+Sans:wght@600;700&display=swap">
<style>
/* Layout: a night-sky shelf of mystery volumes; each tale opens to a paper-colored hatch board you pinch and drag, with the legend as a strip beneath. */
:root{
  --bg:#14103a; --panel:#211a5a; --line:#3b3290; --ink:#f4efff; --muted:#b0a9de;
  --mag:#ff3fa4; --cyan:#35d8f2; --gold:#ffd23f; --good:#5be37d; --bad:#ff6b6b;
  --paper:#f6f0dc; --stage:#0e0b2b;
  --font-display:'IM Fell English',Georgia,'Times New Roman',serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px;overflow:hidden;overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;min-width:0}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}

/* title screen */
#title{position:fixed;inset:0;z-index:60;background:#0d0a2e;overflow:hidden;display:flex;flex-direction:column;align-items:center;transition:opacity .45s}
#title.out{opacity:0;pointer-events:none}
#titleArt{position:absolute;left:50%;top:0;transform:translateX(-50%);image-rendering:pixelated;display:block}
.tt{position:relative;z-index:2;margin-top:max(30px,calc(env(safe-area-inset-top,0px) + 22px));text-align:center;padding:0 18px;pointer-events:none}
.tt .once{font:italic 400 clamp(22px,6vw,30px)/1 var(--font-display);color:#ffe27a;text-shadow:0 2px 0 #3a1a5a,0 0 14px #ff3fa4aa;letter-spacing:.02em}
.tt .big{font:700 clamp(58px,19vw,104px)/.95 'Pixelify Sans','IM Fell English',Georgia,serif;letter-spacing:.02em;margin:2px 0 0;
  background:linear-gradient(180deg,#8ae8ff 0%,#35d8f2 38%,#ff3fa4 62%,#ff86c8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #2a0f5a) drop-shadow(0 0 12px #ff3fa488)}
.tt .tag{margin:8px auto 0;max-width:30ch;color:#fff;font:700 clamp(13px,3.6vw,16px)/1.3 var(--font-body);text-shadow:0 2px 0 #1a1050,0 0 8px #1a1050}
.sw{display:flex;gap:5px;justify-content:center;margin-top:12px}
.sw i{display:block;width:16px;height:16px;border:2px solid #14103a;animation:swp 2.4s ease-in-out infinite;box-shadow:0 2px 0 #14103a}
@keyframes swp{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.tb{position:absolute;z-index:2;left:0;right:0;bottom:max(26px,calc(env(safe-area-inset-bottom,0px) + 18px));display:flex;flex-direction:column;align-items:center;gap:10px}
#playBtn{min-height:60px;padding:0 38px;border-radius:30px;border:3px solid #14103a;background:linear-gradient(180deg,#ff6ac0,#ff3fa4);color:#fff;font:800 22px/1 var(--font-body);letter-spacing:.03em;box-shadow:0 5px 0 #8a1a5a,0 0 24px #ff3fa4aa;animation:pb 1.8s ease-in-out infinite}
#playBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a1a5a}
@keyframes pb{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#titleHelp{min-height:44px;padding:0 18px;border-radius:22px;border:2px solid #14103a;background:#211a5acc;color:#f4efff;font-weight:800;font-size:14px}
@media (prefers-reduced-motion:reduce){.sw i,#playBtn{animation:none}#title{transition:none}}
@media (max-height:520px){.tt{margin-top:8px}.tt .once{font-size:20px}.tt .big{font-size:50px}.tt .tag,.sw{display:none}.tb{flex-direction:row;justify-content:center;bottom:10px}#playBtn{min-height:48px;font-size:18px;padding:0 26px}#titleHelp{min-height:40px}}

/* shelf */
.shelf-head{display:flex;align-items:flex-start;gap:10px;padding-top:4px}
.shelf-head .words{flex:1;min-width:0}
h1{margin:0;font:italic 400 clamp(30px,8vw,40px)/1.05 var(--font-display);letter-spacing:.01em;text-wrap:balance}
h1 em{font-style:italic;color:var(--mag)}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.round{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);font-weight:800;font-size:18px;display:grid;place-items:center}
.stats{margin:0;color:var(--muted);font-size:14px;font-weight:700}
.shelf-actions{display:flex;gap:8px;flex-wrap:wrap}
.vols{flex:none;display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin}
.vol{flex:none;min-height:46px;padding:4px 14px;border-radius:23px;border:1.5px solid var(--line);background:var(--panel);font-weight:800;font-size:14px;line-height:1.15;text-align:center}
.vol small{display:block;font-weight:700;color:var(--muted);font-size:11px}
.vol[aria-pressed="true"]{border-color:var(--mag);box-shadow:0 0 0 2px #ff3fa455}
.cards{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start;padding:2px 0 16px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;padding:10px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);min-width:0}
.card:hover{border-color:var(--cyan)}
.card .thumb{width:100%;aspect-ratio:1;border-radius:8px;image-rendering:pixelated;background:#e9e2c8;display:block}
.card .t{font:italic 400 18px/1.15 var(--font-display);overflow-wrap:anywhere}
.card .m{font-size:13px;color:var(--muted)}
.card .tag{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan)}
.card .bar{height:5px;border-radius:3px;background:#0e0b2b;overflow:hidden}
.card .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--mag));width:0}
.card.done .m{color:var(--good);font-weight:700}

/* home: daily card and story books */
.home{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:18px}
.sec{margin:6px 0 0;font:italic 400 24px/1.1 var(--font-display)}
.daily{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;border:1.5px solid var(--gold);background:linear-gradient(135deg,#2c2270,#3a1f66);box-shadow:0 0 0 2px #ffd23f22}
.daily .thumb{flex:none;width:92px;height:92px;border-radius:10px;image-rendering:pixelated;background:#e9e2c8;display:block}
.daily .dt{min-width:0;display:flex;flex-direction:column;gap:3px;flex:1}
.daily .dt b{font:italic 400 22px/1.1 var(--font-display)}
.daily .dt small{color:var(--muted);font-size:13px}
.daily .streak{font-weight:800;color:var(--gold);font-size:14px}
.daily .btn{flex:none;min-height:42px;margin-top:4px;align-self:flex-start;padding:0 18px}
.holcard{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;border:1.5px solid var(--hacc,var(--gold));background:linear-gradient(135deg,color-mix(in srgb,var(--hacc,#ffd23f) 28%,#1b1450),#241a62);box-shadow:0 0 0 2px color-mix(in srgb,var(--hacc,#ffd23f) 22%,transparent)}
.holcard .hem{flex:none;font-size:44px;line-height:1;filter:drop-shadow(0 2px 6px #0008)}
.holcard .ht{min-width:0;display:flex;flex-direction:column;gap:3px;flex:1}
.holcard .ht b{font:italic 400 22px/1.1 var(--font-display)}
.holcard .ht small{color:var(--muted);font-size:13px}
.holcard .ht .cd{font-weight:800;color:var(--hacc,var(--gold));font-size:14px}
.holcard .btn{flex:none;min-height:42px;margin-top:4px;align-self:flex-start;padding:0 18px}
.holcard[hidden]{display:none}
.book .badge{position:absolute;top:8px;right:8px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--acc);color:#10082e}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.book{display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px;border-radius:16px;border:2px solid var(--acc,var(--line));background:linear-gradient(160deg,var(--panel),#170f45);min-width:0;position:relative}
.book:hover{box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 35%,transparent)}
.book .em{font-size:34px;line-height:1}
.book .bn{font:italic 400 20px/1.1 var(--font-display);overflow-wrap:anywhere}
.book .bt{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.book .bs{font-size:12.5px;color:var(--muted);line-height:1.3}
.book .bar{height:5px;border-radius:3px;background:#0e0b2b;overflow:hidden;margin-top:2px}
.book .bar i{display:block;height:100%;background:var(--acc);width:0}
.book .bm{font-size:12px;font-weight:800;color:var(--muted)}
.book.full .bm{color:var(--good)}
.bookview{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.cathead{display:flex;align-items:center;gap:10px}
.cattitle{min-width:0;display:flex;flex-direction:column}
.cattitle .n{font:italic 400 24px/1.1 var(--font-display);overflow-wrap:anywhere}
.cattitle .s{font-size:13px;color:var(--muted)}
.switch{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.switch p{margin:0;font-size:14px;color:var(--muted)}
.switch b{display:block;color:var(--ink);font-size:16px}
.tgl{flex:none;width:54px;height:32px;border-radius:16px;border:1.5px solid var(--line);background:#0e0b2b;position:relative}
.tgl::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.tgl[aria-pressed="true"]{background:var(--mag);border-color:var(--mag)}
.tgl[aria-pressed="true"]::after{transform:translateX(22px);background:#fff}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gal button{padding:0;border:0;background:none;border-radius:8px;overflow:hidden}
.gal canvas{display:block;width:100%;aspect-ratio:1;image-rendering:pixelated;border-radius:8px}
.note{margin:0;padding:8px 12px;border-radius:12px;background:#2d2470;font-size:14px;font-weight:700;color:var(--gold)}

/* play */
.bar-top{display:flex;align-items:center;gap:10px}
.back{height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--line);background:var(--panel);font-weight:700}
.ttl{flex:1;min-width:0}
.ttl .name{font:italic 400 20px/1.1 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.prog{margin-top:5px;height:6px;border-radius:3px;background:#0e0b2b;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--mag));transition:width .2s}
.layout{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.stage{position:relative;flex:1;min-height:0;min-width:0;overflow:hidden;background:var(--stage);border:1.5px solid var(--line);border-radius:12px;touch-action:none}
#board{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.panel{display:flex;flex-direction:column;gap:8px;flex:none;min-width:0}
.selinfo{display:flex;align-items:center;gap:12px;min-height:50px}
.bigcode{flex:none;width:44px;height:44px;border-radius:50%;background:var(--mag);color:#fff;font-weight:800;font-size:22px;display:grid;place-items:center}
.selname{display:flex;flex-direction:column;min-width:0}
.selname b{font-size:17px;line-height:1.15}
.selname small{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin;touch-action:pan-x}
.chip{flex:none;position:relative;width:44px;height:44px;padding:1px;border:2px solid transparent;border-radius:11px;background:var(--panel)}
.chip canvas{display:block;border-radius:8px}
.chip .c,.chip .n{position:absolute;background:#14103ad9;color:#fff;font-weight:800;font-size:11px;line-height:15px;padding:0 4px;min-width:15px;text-align:center}
.chip .c{left:1px;top:1px;border-radius:8px 0 6px 0}
.chip .n{right:1px;bottom:1px;border-radius:6px 0 8px 0;color:var(--muted);font-weight:700}
.chip.sel{border-color:var(--mag);box-shadow:0 0 0 2px #ff3fa455}
.chip.done{opacity:.5}
.chip.done .n{color:var(--good)}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tool{min-height:48px;padding:4px 2px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11.5px;font-weight:700;color:var(--muted)}
.tool span{font-size:18px;line-height:1;color:var(--ink)}
.tool[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan)}
.tool:disabled{opacity:.4}
@media (orientation:landscape){
  .layout{flex-direction:row}
  .panel{width:min(310px,42%);overflow:auto}
  .chips{flex-wrap:wrap;overflow-x:hidden;touch-action:auto}
}

/* dialogs */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px}
.scrim{position:absolute;inset:0;background:#07051bcc}
.sheet{position:relative;width:min(420px,100%);max-height:100%;overflow:auto;padding:20px;border-radius:18px;background:var(--panel);border:1.5px solid var(--line);display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px #000a;-webkit-user-select:text;user-select:text}
.sheet h2{margin:0;font:italic 400 30px/1.1 var(--font-display);text-wrap:balance}
.eyebrow{margin:0;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.art{width:min(100%,260px);aspect-ratio:1;align-self:center;image-rendering:pixelated;border-radius:8px;box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--mag)}
.blurb{margin:0;font:italic 400 18px/1.4 var(--font-display);max-width:60ch}
.stats2,.hint{margin:0;font-size:14px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{flex:1 1 140px;min-height:46px;padding:0 16px;border-radius:23px;border:1.5px solid var(--line);background:transparent;font-weight:800}
.btn.primary{background:var(--mag);border-color:var(--mag);color:#fff}
.how{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.how li{display:flex;gap:12px;align-items:center}
.how canvas{flex:none;width:40px;height:40px;border-radius:8px}
.how p{margin:0;font-size:15px}
.samples{display:flex;gap:10px;flex-wrap:wrap}
.samples div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.samples canvas{width:44px;height:44px;border-radius:8px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translate(-50%,-8px);z-index:30;max-width:min(92vw,360px);padding:10px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="title" aria-label="Once Upon a Hatch title screen">
  <canvas id="titleArt" aria-hidden="true"></canvas>
  <div class="tt">
    <div class="once">Once Upon a</div>
    <div class="big">Hatch</div>
    <p class="tag">Color the spots. Reveal the tale.</p>
    <div class="sw" aria-hidden="true"><i style="background:#ff3b5c"></i><i style="background:#ff8a1f;animation-delay:.15s"></i><i style="background:#ffd23f;animation-delay:.3s"></i><i style="background:#5be37d;animation-delay:.45s"></i><i style="background:#35d8f2;animation-delay:.6s"></i><i style="background:#5a6ee8;animation-delay:.75s"></i><i style="background:#b05ce8;animation-delay:.9s"></i></div>
  </div>
  <div class="tb"><button id="playBtn" type="button">Open the Book</button><button id="titleHelp" type="button">How to play</button></div>
</section>
<div id="app">
  <section id="shelf" class="screen">
    <header class="shelf-head">
      <div class="words">
        <h1>Once Upon a <em>Hatch</em></h1>
        <p class="sub">Color every spot to reveal the tale. Each picture stays a mystery until it comes together.</p>
      </div>
      <button class="round" id="helpBtn" type="button" aria-label="How to play">?</button>
      <button class="round" id="setBtn" type="button" aria-label="Settings">⚙</button>
      <button class="round" id="muteBtn" type="button" aria-label="Sound on or off">🔊</button>
    </header>
    <div id="homeView" class="home">
      <p class="stats" id="shelfStats"></p>
      <div id="dailyCard" class="daily"></div>
      <div id="holCard" class="holcard" hidden></div>
      <div class="shelf-actions">
        <button class="btn primary" id="contBtn" type="button">Continue</button>
        <button class="btn" id="surpriseBtn" type="button">Surprise me</button>
        <button class="btn" id="galBtn" type="button">My gallery</button>
      </div>
      <h2 class="sec">Story books</h2>
      <div class="books" id="books"></div>
      <h2 class="sec">Holidays</h2>
      <div class="books" id="holBooks"></div>
    </div>
    <div id="bookView" class="bookview" hidden>
      <div class="cathead">
        <button class="back" id="catBack" type="button">‹ Books</button>
        <div class="cattitle"><span class="n" id="catName"></span><span class="s" id="catSub"></span></div>
      </div>
      <div class="shelf-actions">
        <button class="btn primary" id="catCont" type="button">Start</button>
        <button class="btn" id="catSurprise" type="button">Surprise me</button>
      </div>
      <div class="vols" id="vols" role="group" aria-label="Volumes"></div>
      <div id="cards" class="cards"></div>
    </div>
  </section>

  <section id="play" class="screen" hidden>
    <header class="bar-top">
      <button class="back" id="backBtn" type="button">‹ Shelf</button>
      <div class="ttl"><span class="name" id="taleName">Mystery Tale</span><div class="prog"><i id="progFill"></i></div></div>
      <button class="round" id="helpBtn2" type="button" aria-label="How to play">?</button>
    </header>
    <main class="layout">
      <div class="stage" id="stage"><canvas id="board" aria-label="Hatch board. One finger colors, two fingers pinch to zoom and move."></canvas></div>
      <aside class="panel">
        <div class="selinfo" id="selInfo"></div>
        <div class="chips" id="chips"></div>
        <div class="tools">
          <button class="tool" id="wholeBtn" type="button"><span>⤢</span>Whole picture</button>
          <button class="tool" id="whereBtn" type="button"><span>💡</span>Where?</button>
          <button class="tool" id="fillBtn" type="button" aria-pressed="false"><span>🪣</span>Fill area</button>
          <button class="tool" id="guideBtn" type="button" aria-pressed="true"><span>👁</span>Guide</button>
        </div>
      </aside>
    </main>
  </section>

  <div id="modal" class="modal" hidden>
    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script src="puzzles.js"></script>
<script src="tales.js"></script>
<script src="tales_oz.js"></script>
<script src="tales_beast.js"></script>
<script src="tales_wonder.js"></script>
<script src="tales_pan.js"></script>
<script src="tales_classic.js"></script>
<script src="tales_america.js"></script>
<script src="tales_xmas.js"></script>
<script src="tales_xmas2.js"></script>
<script src="tales_thanks.js"></script>
<script src="tales_thanks2.js"></script>
<script src="tales_val.js"></script>
<script src="tales_val2.js"></script>
<script src="tales_july.js"></script>
<script src="tales_july2.js"></script>
<script src="tales_more.js"></script>
<script src="tales_more2.js"></script>
<script src="tales_more3.js"></script>
<script src="tales_more4.js"></script>
<script src="title.js"></script>
<script>
(function () {
  'use strict';
  var KEY = 'onceUponAHatch.v3', OLD_KEY = 'onceUponAHatch.v2', OLD_KEY1 = 'onceUponAHatch.v1';
  var CODES = '123456789ABCDEFGHJKLMNPQRSTUVWXYZ';
  var MARK_TEXT = { slash: 'Hatch with a / slash', back: 'Hatch with a \\ backslash', star: 'Draw a star', fill: 'Color the square in' };
  var MARK_GLYPH = { slash: '╱', back: '╲', star: '★', fill: '■' };

      '<div class="actions"><button class="btn primary" id="okBtn" type="button">Done</button></div>');
    $('#tHatch').addEventListener('click', function () { save.hatch = !save.hatch; this.setAttribute('aria-pressed', save.hatch); persist(); });
    $('#tGuide').addEventListener('click', function () { save.hl = !save.hl; this.setAttribute('aria-pressed', save.hl); persist(); });
    $('#okBtn').addEventListener('click', closeModal);
  }
  $('#setBtn').addEventListener('click', showSettings);

  /* ---------- dialogs ---------- */
  function openModal(html) { $('#sheet').innerHTML = html; $('#modal').hidden = false; var f = $('#sheet button'); if (f) f.focus(); }
  function closeModal() { $('#modal').hidden = true; $('#sheet').innerHTML = ''; }
  $('#scrim').addEventListener('click', function () { if (!G.revealing) closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });

  function artCanvas(p) {
    var S = p.w <= 16 ? 16 : p.w <= 32 ? 8 : 4, cv = document.createElement('canvas'); cv.className = 'art'; cv.width = p.w * S; cv.height = p.h * S;
    var c = cv.getContext('2d');
    for (var i = 0; i < p.total; i++) { c.fillStyle = p.colors[p.cells[i]].hex; c.fillRect((i % p.w) * S, ((i / p.w) | 0) * S, S, S); }
    return cv;
  }
  function showStory(first) {
    var p = G.p, oops = G.oops, nextIdx = -1;
    var cl = CATIDX[p.cat].items, at = cl.indexOf(G.i);
    for (var o = 1; o < cl.length; o++) { var j = cl[(at + o) % cl.length]; if (!isDone(PZ[j])) { nextIdx = j; break; } }
    if (nextIdx < 0) nextIdx = firstUnsolved(G.i);
    var dailyNote = save.dailyDone === todayKey() && G.i === dailyIndex(todayKey()) && first ? '<p class="note">🔥 Puzzle of the Day solved · ' + save.streak.count + '-day streak</p>' : '';
    openModal(
      '<p class="eyebrow">' + (first ? 'You found it!' : 'Tale solved') + '</p>' +
      '<h2>' + esc(p.title) + '</h2><div id="artSlot"></div>' +
      '<p class="blurb">' + esc(p.blurb) + '</p>' +
      dailyNote + '<p class="stats2">' + p.total + ' spots, ' + (oops === 0 ? 'no mix-ups.' : oops + ' mix-up' + (oops === 1 ? '' : 's') + '.') + '</p>' +
      '<p class="hint" id="saveHint" hidden>Press and hold the picture to save it.</p>' +
      '<div class="actions">' +
      (nextIdx >= 0 ? '<button class="btn primary" id="nextBtn" type="button">Next tale ›</button>' : '') +
      '<button class="btn" id="saveBtn" type="button">Save picture</button>' +
      '<button class="btn" id="shelfBtn" type="button">Back to shelf</button>' +
      '<button class="btn" id="againBtn" type="button">Play again</button></div>'
    );
    $('#artSlot').appendChild(artCanvas(p));
    if (nextIdx >= 0) $('#nextBtn').addEventListener('click', function () { closeModal(); var np = PZ[nextIdx]; save.vols[np.cat] = Math.floor(np.ci / PER); openPuzzle(nextIdx); });
    $('#shelfBtn').addEventListener('click', toShelf);
    $('#againBtn').addEventListener('click', function () { delete save.done[p.id]; save.marks[p.id] = ''; save.oops[p.id] = 0; save.last = p.id; persistNow(); closeModal(); openPuzzle(G.i); });
    $('#saveBtn').addEventListener('click', function () { savePicture(p); });
  }
  function savePicture(p) {
    var S = p.w <= 16 ? 20 : p.w <= 32 ? 14 : 7, pad = 28, W = p.w * S + pad * 2, H = p.h * S + pad * 2 + 54;
    var cv = document.createElement('canvas'); cv.width = W; cv.height = H; var c = cv.getContext('2d');
    c.fillStyle = '#14103a'; c.fillRect(0, 0, W, H);
    c.fillStyle = PAPER; c.fillRect(pad - 6, pad - 6, p.w * S + 12, p.h * S + 12);
    for (var i = 0; i < p.total; i++) { c.fillStyle = p.colors[p.cells[i]].hex; c.fillRect(pad + (i % p.w) * S, pad + ((i / p.w) | 0) * S, S, S); }
    c.fillStyle = '#f4efff'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = 'italic 24px "IM Fell English", Georgia, serif'; c.fillText(p.title, W / 2, H - 42, W - 24);
    c.fillStyle = '#b0a9de'; c.font = '700 13px Nunito, system-ui, sans-serif'; c.fillText('Once Upon a Hatch', W / 2, H - 16);
    var url = cv.toDataURL('image/png'), img = document.createElement('img');
    img.className = 'art'; img.src = url; img.alt = p.title + ' picture'; img.width = W; img.height = H; img.style.aspectRatio = W + '/' + H;
    var slot = $('#artSlot'); slot.innerHTML = ''; slot.appendChild(img);
    $('#saveHint').hidden = false;
    var fname = 'once-upon-a-hatch-' + p.id + '.png';
    function plainLink() { try { var a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); } catch (e) {} }
    /* inside the Artifact viewer the platform's downloads capability does the saving; elsewhere (GitHub Pages) a normal download link does */
    var gotCap = false;
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        window.claude.use('downloads').then(function (dl) {
          if (!dl) { plainLink(); return; }
          gotCap = true;
          cv.toBlob(function (blob) {
            if (!blob) { plainLink(); return; }
            dl.save({ filename: fname, data: blob }).then(function () { toast('Picture saved.'); }, function (err) { if (!err || err.code !== 'declined') toast('Press and hold the picture to save it.'); });
          }, 'image/png');
        }, plainLink);
        return;
      }
    } catch (e) {}
    plainLink();
  }
  function showHelp() {
    openModal(
      '<p class="eyebrow">How to play</p><h2>Reveal the tale</h2>' +
      '<ul class="how">' +
      '<li><canvas width="40" height="40" id="hw1"></canvas><p>Every spot has a number or letter. The legend below shows which color each one is.</p></li>' +
      '<li><canvas width="40" height="40" id="hw2"></canvas><p>Pick a color, then tap or drag one finger across the spots with that number. Fill area does a whole patch.</p></li>' +
      '<li><canvas width="40" height="40" id="hw3"></canvas><p>Pinch with two fingers to zoom, and slide two fingers to move around. On a computer, use the scroll wheel and drag with the right button.</p></li></ul>' +
      '<div class="samples"><div><canvas id="sm4" width="88" height="88"></canvas>Color</div><div><canvas id="sm1" width="88" height="88"></canvas>Slash</div><div><canvas id="sm3" width="88" height="88"></canvas>Star</div></div>' +
      '<p class="hint">Wrong spot? It just flashes red. Where? finds the next spot, and Fill area colors a whole patch with one tap. Nobody tells you what the picture is until it shows up. Prefer the old slashes and stars? Switch on Classic hatch mode in Settings (⚙).</p>' +
      '<div class="actions"><button class="btn primary" id="okBtn" type="button">Got it</button></div>'
    );
    [['sm1', 'slash'], ['sm3', 'star'], ['sm4', 'fill']].forEach(function (a) {
      var cv = $('#' + a[0]), c = cv.getContext('2d'); c.fillStyle = PAPER; c.fillRect(0, 0, 88, 88); drawMark(c, 0, 0, 88, '#e0338f', a[1]);
    });
    var hw = $('#hw1').getContext('2d'); hw.fillStyle = PAPER; hw.fillRect(0, 0, 40, 40); hw.fillStyle = INK; hw.font = '800 22px Nunito, system-ui, sans-serif'; hw.textAlign = 'center'; hw.textBaseline = 'middle'; hw.fillText('3', 20, 21);
    hw = $('#hw2').getContext('2d'); hw.fillStyle = PAPER; hw.fillRect(0, 0, 40, 40); drawMark(hw, 0, 0, 40, '#2bb3d6', 'fill');
    hw = $('#hw3').getContext('2d'); hw.fillStyle = PAPER; hw.fillRect(0, 0, 40, 40); drawMark(hw, 0, 0, 40, '#ffb000', 'star');
    $('#okBtn').addEventListener('click', closeModal);
    save.seen = true; persist();
  }
  $('#helpBtn').addEventListener('click', showHelp);
  $('#helpBtn2').addEventListener('click', showHelp);

  /* ---------- go ---------- */
  setMuteIcon();
  if (!save.vols) save.vols = {}; if (!save.streak) save.streak = { count: 0, best: 0, last: '' };
  renderShelf();
  if (window.ResizeObserver) new ResizeObserver(function () {
    if (!G.p || $('#play').hidden) return;
    var c = viewCenter(), cs = G.view.cs; sizeCanvas(); G.view = centerOn(c[0], c[1], cs); draw();
  }).observe(stage);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (!$('#play').hidden) draw(); });
  /* title screen */
  var titleEl = $('#title'), titleArt = null;
  function seasonKey() { var se = seasonFor(new Date()); if (!se) return null; return { xmas: 'xmas', thanks: 'thanks', valentine: 'valentine', july4: 'july4', halloween: 'halloween', easter: 'easter', newyear: 'newyear' }[se.h.id] || null; }
  (function () { var se = seasonFor(new Date()), tg = document.querySelector('#title .tag'); if (se && tg) tg.textContent = se.h.em + ' ' + (se.days === 0 ? se.h.hi : se.h.name + (se.days === 1 ? ' is tomorrow' : ' is in ' + se.days + ' days')) + ' · Color the spots, reveal the tale.'; })();
  function showTitle() {
    titleEl.hidden = false; titleEl.classList.remove('out');
    if (titleArt) titleArt.restart(); else titleArt = TitleArt.start($('#titleArt'), { reduced: reduced, season: seasonKey() });
  }
  function hideTitle(after) {
    initAudio(); sfx('chime'); titleEl.classList.add('out');
    setTimeout(function () { titleEl.hidden = true; if (titleArt) titleArt.stop(); if (after) after(); }, reduced ? 0 : 420);
  }
  $('#playBtn').addEventListener('click', function () { hideTitle(function () { if (!save.seen) showHelp(); }); });
  $('#titleHelp').addEventListener('click', showHelp);
  document.querySelector('#shelf h1').addEventListener('click', function () { if (!$('#play').hidden) return; showTitle(); });
  showTitle();

  window.__hatch = { G: G, PZ: PZ, openPuzzle: openPuzzle, prep: prep, save: save,
    cellClient: function (i) { var r = board.getBoundingClientRect(), V = G.view, p = G.p; return [r.left + V.ox + ((i % p.w) + 0.5) * V.cs, r.top + V.oy + (((i / p.w) | 0) + 0.5) * V.cs]; },
    showWhole: function () { G.view = centerOn(G.p.w / 2, G.p.h / 2, 0); draw(); },
    setView: function (cx, cy, cs) { G.view = centerOn(cx, cy, cs); draw(); } };
})();
</script>

</body>
